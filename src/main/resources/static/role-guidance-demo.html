<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Java Service Roadmap Demo</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  .step { margin: 5px 0; }
  .hidden { display: none; }
</style>
</head>
<body>

<h2>AI Java Service - Personalized Roadmap</h2>

<label for="role">Choose your role:</label>
<select id="role">
  <option value="Backend Developer">Backend Developer</option>
  <option value="Student">Student / Learner</option>
  <option value="AI/ML Engineer">AI/ML Engineer</option>
  <option value="Startup">Startup / Company</option>
</select>
<button onclick="getRoadmap()">Get Roadmap</button>

<div id="roadmap" class="hidden">
  <h3>Steps:</h3>
  <ol id="stepsList"></ol>
</div>

<script>
async function getRoadmap() {
  const role = document.getElementById('role').value;
  const response = await fetch('/api/role-guidance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: role })
  });
  const data = await response.json();
  
  const stepsList = document.getElementById('stepsList');
  stepsList.innerHTML = '';
  data.steps.forEach(step => {
    const li = document.createElement('li');
    li.className = 'step';
    li.textContent = step;
    stepsList.appendChild(li);
  });
  
  document.getElementById('roadmap').classList.remove('hidden');
}
</script>

</body>
</html>
<option value="" disabled selected>Select your role</option>
<select id="role">
  <option value="" disabled selected>Select your role</option>
  <option value="Backend Developer">Backend Developer</option>
  <option value="Student">Student / Learner</option>
  <option value="AI/ML Engineer">AI/ML Engineer</option>
  <option value="Startup">Startup / Company</option>
</select>
